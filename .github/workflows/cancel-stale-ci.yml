name: Cancel stale CI

on:
  push:
    branches:
      - codex/p1-reliability-fixes

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Force-cancel stale runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -u
          run_ids=(
            36608346825
            36608597315
            36608623395
            36608640200
            36608674164
            36608714845
            36613524500
            36613540883
          )
          for run_id in "${run_ids[@]}"; do
            status=$(gh api "repos/$GH_REPO/actions/runs/$run_id" --jq '.status' 2>/dev/null || echo missing)
            if [ "$status" = "completed" ] || [ "$status" = "missing" ]; then
              echo "Skipping run $run_id ($status)"
              continue
            fi
            if gh api --method POST "repos/$GH_REPO/actions/runs/$run_id/force-cancel" --silent; then
              echo "Force-cancelled run $run_id"
            else
              gh api --method POST "repos/$GH_REPO/actions/runs/$run_id/cancel" --silent || true
              echo "Requested cancellation for run $run_id"
            fi
          done
