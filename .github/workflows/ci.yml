name: CI

on:
  push:
  pull_request:

permissions:
  actions: write
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-publish:
    runs-on: windows-latest
    steps:
      - name: Cancel stale CI runs
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $runIds = @(36608346825, 36608597315, 36608623395, 36608640200, 36608674164, 36608714845)
          foreach ($runId in $runIds) {
            $uri = "https://api.github.com/repos/${{ github.repository }}/actions/runs/$runId/cancel"
            try {
              Invoke-RestMethod -Method Post -Uri $uri -Headers $headers | Out-Null
              Write-Host "Cancelled stale run $runId"
            }
            catch {
              Write-Warning "Could not cancel stale run $runId`: $($_.Exception.Message)"
            }
          }
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore .\pal-server-manager.slnx
      - name: Release x64 build
        run: dotnet build .\pal-server-manager.slnx -c Release --no-restore
      - name: Synthetic regression tests
        run: dotnet run --project .\PalServerManager.RegressionTests\PalServerManager.RegressionTests.csproj -c Release --no-build
      - name: Framework-dependent win-x64 publish
        run: |
          dotnet publish .\PalServerManager.WinUI\PalServerManager.WinUI.csproj -c Release -r win-x64 --self-contained false -o .\artifacts\WinUI
          dotnet publish .\PalServer-KeepAwake.Native\PalServer-KeepAwake.Native.csproj -c Release -r win-x64 --self-contained false -o .\artifacts\WinUI\Helpers
      - name: Include notices in PR preview
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $notices = @(
            @{ Source = '.\LICENSE'; Destination = '.\artifacts\WinUI\LICENSE' },
            @{ Source = '.\docs\ASSETS.md'; Destination = '.\artifacts\WinUI\ASSETS.md' }
          )
          foreach ($notice in $notices) {
            if (-not (Test-Path -LiteralPath $notice.Source -PathType Leaf)) {
              throw "Required preview notice is missing: $($notice.Source)"
            }
            Copy-Item -LiteralPath $notice.Source -Destination $notice.Destination -Force
            if (-not (Test-Path -LiteralPath $notice.Destination -PathType Leaf)) {
              throw "Failed to copy preview notice: $($notice.Destination)"
            }
          }
      - name: Upload PR preview build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: PalServerManager-PR-preview
          path: .\artifacts\WinUI
          retention-days: 7
          if-no-files-found: error
